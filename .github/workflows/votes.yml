name: Record vote

on:
  repository_dispatch:
    types: [vote_cast]
  workflow_dispatch:
    inputs:
      mpId:
        description: "MP id (e.g. luxon)"
        required: true
      sentiment:
        description: "favourable or unfavourable"
        required: true
      providedSecret:
        description: "Must match VOTE_WEBHOOK_SECRET"
        required: true

permissions:
  contents: write

jobs:
  record-vote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply vote
        env:
          VOTE_WEBHOOK_SECRET: ${{ secrets.VOTE_WEBHOOK_SECRET }}
          VOTE_MP_ID: ${{ github.event.client_payload.mpId || inputs.mpId }}
          VOTE_SENTIMENT: ${{ github.event.client_payload.sentiment || inputs.sentiment }}
          VOTE_PROVIDED_SECRET: ${{ github.event.client_payload.secret || inputs.providedSecret }}
        run: node scripts/collect-vote.mjs

      - name: Commit votes data
        run: |
          set -e
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/votes.json
          if git diff --staged --quiet; then
            echo "No vote changes"
            exit 0
          fi
          git commit -m "chore(votes): record user vote tally"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            echo "push rejected, rebase retry ${i}"
            sleep $((i * 3))
          done
          echo "Could not push after retries"
          exit 1
