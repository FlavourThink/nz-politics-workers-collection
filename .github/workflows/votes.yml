name: Record vote

# Triggered by the vote door (repository_dispatch), not by the browser directly.
on:
  repository_dispatch:
    types: [vote_cast]
  workflow_dispatch:
    inputs:
      mpId:
        description: "MP id (e.g. luxon)"
        required: true
      sentiment:
        description: "favourable or unfavourable"
        required: true
      providedSecret:
        description: "Must match VOTE_WEBHOOK_SECRET"
        required: true

permissions:
  contents: write

jobs:
  record-vote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply vote
        env:
          VOTE_WEBHOOK_SECRET: ${{ secrets.VOTE_WEBHOOK_SECRET }}
          VOTE_MP_ID: ${{ github.event.client_payload.mpId || inputs.mpId }}
          VOTE_SENTIMENT: ${{ github.event.client_payload.sentiment || inputs.sentiment }}
          VOTE_PROVIDED_SECRET: ${{ github.event.client_payload.secret || inputs.providedSecret }}
        run: node scripts/collect-vote.mjs

      - name: Commit votes data
        run: |
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/votes.json
          git diff --staged --quiet || git commit -m "chore(votes): record user vote tally"
          git push
