name: News headlines

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect NZ news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
        run: node scripts/collect-news.mjs

      - name: Commit news data
        run: |
          set -e
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "chore(news): update headlines snapshot"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            echo "push rejected, rebase retry ${i}"
            sleep $((i * 3))
          done
          echo "Could not push after retries"
          exit 1
