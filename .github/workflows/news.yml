name: News headlines

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect NZ news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.WORLD_NEWS_API_KEY }}
        run: node scripts/collect-news.mjs

      - name: Commit news data
        run: |
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore(news): update headlines snapshot"
          git push
