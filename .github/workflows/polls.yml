name: Opinion polls

on:
  schedule:
    # Once a day 06:00 UTC (~6pm NZST / 7pm NZDT depending on DST)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-polls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect opinion polls
        run: node scripts/collect-polls.mjs

      - name: Commit polls data
        run: |
          set -e
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/polls.json
          if git diff --staged --quiet; then
            echo "No poll changes"
            exit 0
          fi
          git commit -m "chore(polls): update opinion poll snapshot"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            echo "push rejected, rebase retry ${i}"
            sleep $((i * 3))
          done
          echo "Could not push after retries"
          exit 1
