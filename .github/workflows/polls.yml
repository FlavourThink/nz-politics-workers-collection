name: Opinion polls

on:
  schedule:
    # Once a day 06:00 UTC (~6pm NZST / 7pm NZDT depending on DST)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-polls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Collect opinion polls
        run: node scripts/collect-polls.mjs

      - name: Commit polls data
        run: |
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/polls.json
          git diff --staged --quiet || git commit -m "chore(polls): update opinion poll snapshot"
          git push
