name: MP roster

on:
  schedule:
    # Once a day 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-mps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect MP roster
        run: node scripts/collect-mps.mjs

      - name: Commit mps data
        run: |
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/mps.json
          git diff --staged --quiet || git commit -m "chore(mps): daily MP roster snapshot"
          git push
