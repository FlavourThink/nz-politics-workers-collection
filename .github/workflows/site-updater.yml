name: Site updater

on:
  workflow_run:
    workflows: ["News headlines", "Opinion polls", "Record vote"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge into latest.json
        run: node scripts/update-site.mjs

      - name: Commit latest snapshot
        run: |
          set -e
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No latest.json changes"
            exit 0
          fi
          git commit -m "chore(site): refresh latest.json from workers"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push && exit 0
            echo "push rejected, rebase retry ${i}"
            sleep $((i * 3))
          done
          echo "Could not push after retries"
          exit 1
