name: Site updater

# Runs after news, polls, or votes workflows complete successfully
on:
  workflow_run:
    workflows: ["News headlines", "Opinion polls", "Record vote", "MP roster"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Merge into latest.json
        run: node scripts/update-site.mjs

      - name: Commit latest snapshot
        run: |
          git config user.name "nz-politics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "chore(site): refresh latest.json from workers"
          git push
